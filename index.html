<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>

<!-- ambil data hasil export qgis2web -->
<!-- kalau file kamu ada di folder lain, sesuaikan path ini -->
<script src="./qgis2web_2026_04_22-17_56_05_474157/layers/OSMPermukimanSleman_1.js"></script>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiZWxsZW5mcmV5amF1emFhIiwiYSI6ImNtbnBvZDd0bjJrMmYyb29vZXhrcmMycXcifQ.K1Mt6Dg-PwyUlsb4NiypmQ';

  const centerAwal = [110.3671, -7.8014];
  const zoomAwal = 16;
  const zoomLokasiPengguna = 17;

  const statusBox = document.getElementById('status');
  const featureCountEl = document.getElementById('featureCount');
  const heroFeatureCountEl = document.getElementById('heroFeatureCount');
  const layerStatusEl = document.getElementById('layerStatus');
  const basemapStatusEl = document.getElementById('basemapStatus');
  const mousePositionEl = document.getElementById('mousePosition');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const mapWrapper = document.getElementById('mapWrapper');

  let dataGeojsonGlobal = null;
  let lokasiPengguna = null;
  let markerLokasiPengguna = null;
  let eventLayerSudahDipasang = false;

  const basemapStyles = {
    streets: 'mapbox://styles/mapbox/streets-v12',
    satellite: 'mapbox://styles/mapbox/satellite-streets-v12',
    light: 'mapbox://styles/mapbox/light-v11'
  };

  function setStatus(text, isError = false) {
    statusBox.textContent = text;

    if (isError) {
      statusBox.style.background = '#f8d7da';
      statusBox.style.color = '#842029';
      statusBox.style.border = '1px solid #f5c2c7';
    } else {
      statusBox.style.background = '#d1e7dd';
      statusBox.style.color = '#0f5132';
      statusBox.style.border = '1px solid #badbcc';
    }
  }

  function showLoading(show = true) {
    if (show) {
      loadingOverlay.classList.remove('hidden');
    } else {
      loadingOverlay.classList.add('hidden');
    }
  }

  function hitungBoundsDariGeoJSON(data) {
    const bounds = new mapboxgl.LngLatBounds();

    if (!data || !data.features) return bounds;

    data.features.forEach(feature => {
      if (!feature.geometry) return;

      const geometry = feature.geometry;

      if (geometry.type === 'Polygon') {
        geometry.coordinates.forEach(ring => {
          ring.forEach(coord => bounds.extend(coord));
        });
      } else if (geometry.type === 'MultiPolygon') {
        geometry.coordinates.forEach(polygon => {
          polygon.forEach(ring => {
            ring.forEach(coord => bounds.extend(coord));
          });
        });
      }
    });

    return bounds;
  }

  function kembaliKeLokasi() {
    if (dataGeojsonGlobal) {
      const bounds = hitungBoundsDariGeoJSON(dataGeojsonGlobal);

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds, {
          padding: 40,
          duration: 1000
        });
        setStatus('Status: peta diarahkan ke area data permukiman.');
        return;
      }
    }

    map.flyTo({
      center: centerAwal,
      zoom: zoomAwal,
      essential: true
    });

    setStatus('Status: area data tidak tersedia, peta diarahkan ke titik default.');
  }

  function dapatkanLokasiPengguna() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Browser tidak mendukung geolokasi.'));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lng = position.coords.longitude;
          const lat = position.coords.latitude;
          lokasiPengguna = [lng, lat];
          resolve(lokasiPengguna);
        },
        (error) => {
          reject(error);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    });
  }

  function tampilkanMarkerLokasiPengguna(coords) {
    if (markerLokasiPengguna) {
      markerLokasiPengguna.remove();
    }

    markerLokasiPengguna = new mapboxgl.Marker({ color: '#0d6efd' })
      .setLngLat(coords)
      .setPopup(new mapboxgl.Popup().setHTML('<b>Lokasi Anda Saat Ini</b>'))
      .addTo(map);
  }

  function kembaliKeLokasiPengguna() {
    if (lokasiPengguna) {
      map.flyTo({
        center: lokasiPengguna,
        zoom: zoomLokasiPengguna,
        essential: true
      });

      tampilkanMarkerLokasiPengguna(lokasiPengguna);
      setStatus('Status: peta diarahkan ke lokasi terkini pengguna.');
      return;
    }

    dapatkanLokasiPengguna()
      .then((coords) => {
        map.flyTo({
          center: coords,
          zoom: zoomLokasiPengguna,
          essential: true
        });

        tampilkanMarkerLokasiPengguna(coords);
        setStatus('Status: lokasi terkini pengguna berhasil ditemukan.');
      })
      .catch(() => {
        setStatus('Gagal mendapatkan lokasi pengguna. Peta diarahkan ke area data.', true);
        kembaliKeLokasi();
      });
  }

  function toggleFullscreenMap() {
    if (!document.fullscreenElement) {
      mapWrapper.requestFullscreen().catch(err => {
        console.error('Gagal fullscreen:', err);
      });
    } else {
      document.exitFullscreen();
    }
  }

  function ambilNilaiDariBeberapaKey(properties, daftarKey) {
    for (const key of daftarKey) {
      if (
        Object.prototype.hasOwnProperty.call(properties, key) &&
        properties[key] !== null &&
        properties[key] !== undefined &&
        properties[key] !== ''
      ) {
        return properties[key];
      }
    }
    return null;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatNilai(label, value) {
    if (value === null || value === undefined || value === '') return null;

    const angka = Number(value);
    if (!Number.isNaN(angka) && (label === 'Luas' || label === 'Keliling')) {
      return angka.toLocaleString('id-ID', {
        maximumFractionDigits: 6
      });
    }

    return value;
  }

  function buatHTMLPopup(properties) {
    const daftarField = [
      { label: 'Bangunan',  keys: ['Bangunan', 'building'] },
      { label: 'Kapanewon', keys: ['Kapanewon'] },
      { label: 'Kalurahan', keys: ['Kalurahan'] },
      { label: 'Kabupaten', keys: ['Kabupaten'] },
      { label: 'Provinsi',  keys: ['Provinsi'] },
      { label: 'Negara',    keys: ['Negara'] },
      { label: 'ID OSM',    keys: ['ID OSM', 'ID_OSM', 'osm_id'] },
      { label: 'ID Lengkap', keys: ['ID Lengkap', 'ID_Lengkap', 'full_id'] },
      { label: 'Tipe OSM',  keys: ['Tipe OSM', 'Tipe_OSM', 'osm_type'] },
      { label: 'Luas',      keys: ['Luas'] },
      { label: 'Keliling',  keys: ['Keliling'] }
    ];

    let isiAtribut = '';

    daftarField.forEach(field => {
      const nilai = ambilNilaiDariBeberapaKey(properties, field.keys);
      if (nilai !== null) {
        isiAtribut += `
          <div class="popup-item">
            <span class="popup-key">${escapeHtml(field.label)}</span>
            <span class="popup-value">${escapeHtml(formatNilai(field.label, nilai))}</span>
          </div>
        `;
      }
    });

    if (!isiAtribut) {
      isiAtribut = `
        <div class="popup-item">
          <span class="popup-key">Info</span>
          <span class="popup-value">Tidak ada atribut yang ditampilkan</span>
        </div>
      `;
    }

    return `
      <div class="popup-card">
        <div class="popup-header">
          <i class="fa-solid fa-house me-2"></i>Informasi Permukiman
        </div>
        <div class="popup-body">
          ${isiAtribut}
        </div>
      </div>
    `;
  }

  function pasangEventLayer() {
    if (eventLayerSudahDipasang) return;

    map.on('click', 'house-fill', function (e) {
      const properties = e.features[0].properties || {};

      new mapboxgl.Popup({ className: 'custom-popup' })
        .setLngLat(e.lngLat)
        .setHTML(buatHTMLPopup(properties))
        .addTo(map);
    });

    map.on('mouseenter', 'house-fill', function () {
      map.getCanvas().style.cursor = 'pointer';
    });

    map.on('mouseleave', 'house-fill', function () {
      map.getCanvas().style.cursor = '';
    });

    eventLayerSudahDipasang = true;
  }

  function tambahkanLayerGeoJSON(data) {
    if (map.getSource('house')) {
      if (map.getLayer('house-fill')) map.removeLayer('house-fill');
      if (map.getLayer('house-outline')) map.removeLayer('house-outline');
      map.removeSource('house');
    }

    map.addSource('house', {
      type: 'geojson',
      data: data
    });

    map.addLayer({
      id: 'house-fill',
      type: 'fill',
      source: 'house',
      paint: {
        'fill-color': '#f97316',
        'fill-opacity': 0.75
      }
    });

    map.addLayer({
      id: 'house-outline',
      type: 'line',
      source: 'house',
      paint: {
        'line-color': '#c2410c',
        'line-width': 1.5
      }
    });

    layerStatusEl.textContent = 'Tampil';
    pasangEventLayer();
  }

  function gantiBasemap(mode) {
    if (!basemapStyles[mode]) return;

    basemapStatusEl.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
    showLoading(true);
    map.setStyle(basemapStyles[mode]);

    map.once('style.load', function () {
      if (dataGeojsonGlobal) {
        tambahkanLayerGeoJSON(dataGeojsonGlobal);
      }

      if (lokasiPengguna) {
        tampilkanMarkerLokasiPengguna(lokasiPengguna);
      }

      showLoading(false);
    });
  }

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: centerAwal,
    zoom: zoomAwal
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-left');
  map.addControl(new mapboxgl.FullscreenControl(), 'top-left');
  map.addControl(new mapboxgl.ScaleControl({
    maxWidth: 120,
    unit: 'metric'
  }), 'bottom-right');

  map.on('error', function (e) {
    console.error('Mapbox error:', e);
  });

  map.on('mousemove', function (e) {
    mousePositionEl.textContent = `${e.lngLat.lng.toFixed(6)}, ${e.lngLat.lat.toFixed(6)}`;
  });

  map.on('load', async function () {
    try {
      showLoading(true);
      setStatus('Status: membaca data hasil qgis2web...');

      if (typeof json_OSMPermukimanSleman_1 === 'undefined') {
        throw new Error('Variabel qgis2web "json_OSMPermukimanSleman_1" tidak ditemukan.');
      }

      const data = json_OSMPermukimanSleman_1;

      if (!data || data.type !== 'FeatureCollection') {
        throw new Error('Data qgis2web tidak valid. Harus berupa FeatureCollection.');
      }

      if (!Array.isArray(data.features)) {
        throw new Error('Property "features" tidak ditemukan atau bukan array.');
      }

      if (data.features.length === 0) {
        throw new Error('Data qgis2web berhasil dibaca, tetapi tidak ada feature di dalamnya.');
      }

      dataGeojsonGlobal = data;
      featureCountEl.textContent = data.features.length;
      heroFeatureCountEl.textContent = data.features.length;
      layerStatusEl.textContent = 'Tampil';

      tambahkanLayerGeoJSON(data);
      setStatus('Status: data qgis2web berhasil dibaca. Jumlah feature: ' + data.features.length);

      try {
        const coords = await dapatkanLokasiPengguna();

        map.flyTo({
          center: coords,
          zoom: zoomLokasiPengguna,
          essential: true
        });

        tampilkanMarkerLokasiPengguna(coords);
        setStatus('Status: peta berhasil dimuat dan diarahkan ke lokasi terkini pengguna.');
      } catch (geoError) {
        const bounds = hitungBoundsDariGeoJSON(data);

        if (!bounds.isEmpty()) {
          map.fitBounds(bounds, { padding: 40 });
          setStatus('Status: lokasi pengguna tidak tersedia, peta diarahkan ke area data.');
        } else {
          setStatus('Status: data terbaca, tetapi bounds kosong. Cek geometri polygon.', true);
        }
      }

      showLoading(false);

    } catch (error) {
      console.error('ERROR DEBUG:', error);
      setStatus('Gagal: ' + error.message, true);
      showLoading(false);
    }
  });
</script>
